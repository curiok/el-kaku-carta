name: Despliegue El Kaku Carta Digital

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos mínimos de seguridad requeridos por GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: node tests/run-all-tests.js

      - name: Compilar carta pública y panel administrativo
        run: npm run bundle:static

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'publisher/dist-public'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
